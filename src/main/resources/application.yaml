spring:
  application:
    name: compliance

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          sanction-client:
            url: http://localhost:3001
            logger-level: full
            default-request-headers:
              x-api-key: kyc-secret-123
          aml-client:
            url: http://localhost:3002
            logger-level: full
            default-request-headers:
              authorization: Bearer xyz123



logging.level.dio.compliance.infrastructure.rest: DEBUG